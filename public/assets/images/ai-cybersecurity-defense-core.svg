<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#050811;">
  <defs>
    <linearGradient id="aiCoreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(56, 189, 248, 0.15)"/>
    </pattern>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#aiCoreBg)"/>
  <rect width="1280" height="720" fill="url(#dotGrid)"/>

  <!-- Left: Threat Ingestion Matrix -->
  <g transform="translate(100, 150)">
    <rect width="300" height="420" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5"/>
    <text x="24" y="45" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">01 / AUTONOMOUS TELEMETRY</text>
    
    <g transform="translate(20, 70)">
      <rect width="260" height="65" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.2)"/>
      <circle cx="25" cy="32" r="8" fill="#00f0ff"/>
      <text x="45" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">EDR Behavioral Streams</text>
      <text x="45" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">500k events/sec analyzed</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="260" height="65" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.2)"/>
      <circle cx="25" cy="32" r="8" fill="#8b5cf6"/>
      <text x="45" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">AI Threat Graph Neural Net</text>
      <text x="45" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Anomaly detection: 99.8%</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="260" height="65" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.2)"/>
      <circle cx="25" cy="32" r="8" fill="#10b981"/>
      <text x="45" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Automated CVE Triaging</text>
      <text x="45" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">CVSS dynamic reassessment</text>
    </g>

    <text x="24" y="380" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Continuous AI Self-Supervision</text>
  </g>

  <!-- Center: AI Defense Core Engine -->
  <g transform="translate(490, 130)">
    <!-- Outer Orbital Rings -->
    <circle cx="150" cy="220" r="140" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" stroke-dasharray="8,6"/>
    <circle cx="150" cy="220" r="110" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="2"/>
    <circle cx="150" cy="220" r="80" fill="rgba(15, 23, 42, 0.9)" stroke="url(#purpleCyan)" stroke-width="3" filter="url(#aiGlow)"/>
    
    <!-- Central AI Brain/Shield Icon -->
    <path d="M 130 205 C 130 190 170 190 170 205 C 170 230 150 245 150 250 M 150 215 L 150 235" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="220" r="15" fill="rgba(0, 240, 255, 0.3)"/>

    <!-- Labels -->
    <text x="150" y="390" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="800" text-anchor="middle">AUTONOMOUS DEFENSE CORE</text>
    <text x="150" y="415" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">SUB-SECOND INCIDENT RESPONSE</text>
  </g>

  <!-- Right: Automated Hardening & Remediation -->
  <g transform="translate(880, 150)">
    <rect width="300" height="420" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5"/>
    <text x="24" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">02 / MODEL HARDENING &amp; ACTION</text>
    
    <g transform="translate(20, 70)">
      <rect width="260" height="65" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(0, 240, 255, 0.2)"/>
      <circle cx="25" cy="32" r="8" fill="#38bdf8"/>
      <text x="45" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Zero-Trust Agent Scoping</text>
      <text x="45" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Least-privilege isolation</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="260" height="65" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(0, 240, 255, 0.2)"/>
      <circle cx="25" cy="32" r="8" fill="#10b981"/>
      <text x="45" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Adversarial Robustness</text>
      <text x="45" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Continuous red-teaming</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="260" height="65" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(0, 240, 255, 0.2)"/>
      <circle cx="25" cy="32" r="8" fill="#8b5cf6"/>
      <text x="45" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Human-In-The-Loop Signoff</text>
      <text x="45" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Tier-1 critical action review</text>
    </g>

    <text x="24" y="380" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Verified Defensive Ecosystem</text>
  </g>

  <!-- Top Banner -->
  <text x="640" y="60" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">AI-POWERED CYBERSECURITY: AUTONOMOUS DEFENSE &amp; MODEL HARDENING</text>
  <text x="640" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">HackWithKunal Research Overview • Machine Learning Security Frontiers</text>
</svg>
