<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#050811;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.05)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Left: Threat Infiltration (Blocked) -->
  <g transform="translate(140, 160)">
    <rect width="280" height="400" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5"/>
    <text x="24" y="45" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="1">MALICIOUS ENCRYPTION VECTOR</text>
    
    <!-- Code Blocks -->
    <rect x="24" y="70" width="232" height="60" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="36" y="95" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12">EXTORTION: VSS_DELETE()</text>
    <text x="36" y="115" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">[BLOCKED BY EDR AGENT]</text>

    <rect x="24" y="145" width="232" height="60" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="36" y="170" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12">RANSOM KEY ATTEMPT</text>
    <text x="36" y="190" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">[C2 CONNECTION SEVERED]</text>

    <circle cx="140" cy="280" r="45" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2"/>
    <path d="M 125 265 L 155 295 M 155 265 L 125 295" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <text x="140" y="350" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Payload Execution Denied</text>
  </g>

  <!-- Central Defensive Shield Vault -->
  <g transform="translate(480, 110)">
    <!-- Central Hexagon / Shield -->
    <path d="M 160 40 L 280 100 L 280 280 L 160 380 L 40 280 L 40 100 Z" fill="url(#shieldGrad)" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Shield Core Elements -->
    <circle cx="160" cy="200" r="55" fill="rgba(10, 15, 29, 0.8)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Lock Icon -->
    <path d="M 145 190 L 145 175 C 145 162 175 162 175 175 L 175 190 M 140 190 L 180 190 L 180 220 L 140 220 Z" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="160" y="320" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" text-anchor="middle">IMMUTABLE DEFENSE VAULT</text>
    <text x="160" y="345" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">AIR-GAPPED &amp; ENCRYPTED BACKUPS</text>
  </g>

  <!-- Right: Incident Mitigation & Recovery -->
  <g transform="translate(860, 160)">
    <rect width="280" height="400" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <text x="24" y="45" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="1">RESILIENT RECOVERY PIPELINE</text>
    
    <rect x="24" y="70" width="232" height="60" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="36" y="95" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12">SNAPSHOT INTEGRITY: 100%</text>
    <text x="36" y="115" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">[WORM STORAGE VERIFIED]</text>

    <rect x="24" y="145" width="232" height="60" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="36" y="170" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12">RECOVERY TIME: &lt; 15 MIN</text>
    <text x="36" y="190" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">[ZERO RANSOM PAID]</text>

    <circle cx="140" cy="280" r="45" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
    <path d="M 120 280 L 135 295 L 165 265" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="140" y="350" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Enterprise Continuity Secured</text>
  </g>

  <!-- Connecting Data Lines -->
  <path d="M 420 360 L 520 360" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 760 360 L 860 360" stroke="#10b981" stroke-width="2"/>

  <!-- Top Title Banner -->
  <text x="640" y="60" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">RANSOMWARE DEFENSE ARCHITECTURE &amp; EXTORTION MITIGATION</text>
  <text x="640" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">HackWithKunal Technical Advisory • Educational Security Blueprint</text>
</svg>
